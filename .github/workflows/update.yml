name: daily-update

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 (한국시간)
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch Seoul rent contracts
        shell: pwsh
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TZ: Asia/Seoul
        run: ./update.ps1
      - name: Commit data
        run: |
          git config user.name "rent-radar-bot"
          git config user.email "rent-radar-bot@users.noreply.github.com"
          git add docs/data.js docs/notices.js
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F)"
          git push
